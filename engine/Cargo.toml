[package]
name = "poker_engine"
version = "0.1.0"
edition = "2021"
description = "No-Limit Texas Hold'em rules engine and 7-card hand evaluator with Python bindings"
license = "MIT"
publish = false

[lib]
name = "poker_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# PyO3 bindings. maturin enables this (see pyproject.toml); plain `cargo test`
# builds the pure-Rust library without linking against Python.
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.29", optional = true }
numpy = { version = "0.29", optional = true }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"

[profile.dev]
opt-level = 1

[[example]]
name = "throughput"
