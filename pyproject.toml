[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerbot"
version = "0.1.0"
description = "Self-trained heads-up No-Limit Texas Hold'em bot: engines, agents, evaluation and play protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "maturin>=1.5",
]

[tool.setuptools.packages.find]
include = ["pokerbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "gpu: tests that need a CUDA device",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["engine/target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
