name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check pokerbot tests scripts
      - name: Pytest (CPU, reference engine)
        env:
          POKERBOT_ENGINE: reference
        run: python -m pytest -q -m "not slow"
