# Real-time search with value-net leaves (pokerbot/search, docs/value_net.md).
# Same as search_default.yaml except where noted. leaf.net must point at a trained
# checkpoint: a turn-end net (one row per leaf, fast) or a river net (48 rows per
# leaf, slower); the agent picks the evaluator from the checkpoint's kind.
#   python scripts/play_match.py --config configs/match_search_vn.yaml

search:
  device: auto
  seed: 0
  time_budget:              # seconds per decision: tree + gadget + leaf setup + solve
    flop: 4.0               # value-net flop solves fit a < 5 s decision
    turn: 2.0               # depth-0 turn solves (below): about 230 iterations
    river: 1.0
  min_iterations: 10
  remove_own_blockers: true
  fallback_on_error: true

  tree:
    actions: blueprint      # the blueprint's own abstraction (dcfr4: 12 actions per street)
    depth_streets: 1        # flop solves: flop + turn, value-net leaves at the end of the turn
    # turn solves: turn betting only, value-net leaves at the end of the turn (leaf.turn_net,
    # the river net averaged over the river cards): the blueprint's whole turn abstraction in
    # about 170 nodes. On 18 turn spots it beat 6000-node turn trees solved to showdown (whose
    # river had no bet below all-in) in every spot, by 256 mbb/hand one-sided
    # (docs/value_net_eval.md, Round 3); the river roots below its leaves are cached for
    # continual resolving
    depth_streets_turn: 0
    max_nodes: 6000         # turn and river trees; value-net leaves count 1 node
    # flop trees: 20000 keeps the blueprint's whole flop abstraction (18.3k nodes, 2,009
    # leaves, about 65 DCFR iterations in 4 s). On 3 spots scored on that trunk it beat
    # 6000 (186 iterations) and 10000 (158) even with re-searches of off-tree sizes
    # (docs/value_net_eval.md, 2026-10-07)
    max_nodes_flop: 20000
    chance_cards: null
    min_chance_cards: 4

  solver:
    algorithm: dcfr
    iterations: 1000
    max_runouts: 48
    dtype: float32

  leaf:
    mode: value_net
    # turn-end net, round 3: 2048 x 8 layers, 120k steps. 11% lower leaf error than round 2's
    # turn_v3w at production leaf states, 2-3% less exploitable on 12 flop spots, 58 instead
    # of 62 flop iterations in 4 s (docs/value_net_eval.md, Round 3)
    net: runs/value_net/turn_v4e.pt
    turn_net: runs/value_net/river_v3.pt  # trees rooted on the turn: river net x 48 river cards
    net_every: 1

  gadget:
    safe: true              # safe resolving from the previous street's cached solve
    prior_mix: 0.05
    rollouts: 256
    # first decision of a street without a cached solve (the root ranges are the
    # blueprint's): no gadget. On 6 flop spots (docs/value_net_eval.md, 2026-10-07)
    # this beat terminate values from 256 or 4096 rollouts and from the search tree
    # in strength and in per-hand excess over the blueprint, and leaves the whole
    # 4 s to DCFR (about 185 iterations).
    terminate: unsafe
