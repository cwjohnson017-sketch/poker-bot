# Postflop card buckets for the Phase 1 blueprint (DESIGN.md 5.3):
# 1000 / 1000 / 1000 buckets, sized for one RTX 4070 Ti (12 GB VRAM).
#
#   python scripts/build_buckets.py --config configs/buckets_hunl.yaml --device cuda
#   python scripts/build_buckets.py --config configs/buckets_hunl.yaml --streets flop
#
# Then point configs/mccfr_hunl.yaml at the tables:
#   cards:
#     buckets: [169, 1000, 1000, 1000]
#     tables: {preflop: null, flop: data/abstraction/buckets_hunl/flop.npy,
#              turn: data/abstraction/buckets_hunl/turn.npy,
#              river: data/abstraction/buckets_hunl/river.npy}
#
# Work: river 123M classes x 990 opponent hands, turn 14M x 46 rivers x 990,
# flop 1.29M x 128 sampled runouts x 990; about 9.6e11 7-card evaluations,
# 43 hours on the 4-core development CPU (measured rates). Expected time on
# the 4070 Ti: ~1.3 hours (turn ~55 min, flop ~12 min, river ~9 min, plus a
# few minutes of caching and k-means), 45 minutes to 2.5 hours depending on
# the evaluator throughput actually reached; see pokerbot/abstraction/README.md
# for the measurements and the scaling assumption. Check the real rate first
# with a smoke run: --limit 20000 prints idx/s per street.
#
# Memory. VRAM: equity kernels evaluate at most max_rows = 8M hands per call
# (~3 GB of int64 temporaries); k-means distance batches are fit_chunk x 1000
# floats. Host RAM: ~1 GB for the river features (memory-mapped under
# <out_dir>/features, reused on re-runs), ~0.9 GB for the canonical
# representatives cache (data/abstraction/canonical_3.npy, built once with
# ~2 minutes of CPU), 250 MB for the river table. Disk: ~2.5 GB in total.

seed: 0

buckets:
  out_dir: data/abstraction/buckets_hunl
  device: cuda
  max_rows: 8388608          # 7-card hands per equity kernel call
  weighted: true             # weight classes by the raw hands they stand for
  canonical_cache: data/abstraction
  feature_cache: true        # features under <out_dir>/features, reused when unchanged
  limit: null                # set (or --limit N) for a smoke run on N random indices

  streets:
    flop:
      buckets: 1000
      bins: 10
      runouts: 128           # sampled (turn, river) runouts, exact equity each
      sample: 500000         # fit centres on 500k of the 1.29M classes, then assign all
      iters: 30
      chunk: 4096
      fit_chunk: 131072
    turn:
      buckets: 1000
      bins: 10
      runouts: 0             # all 46 river cards, exact equity each
      sample: 2000000        # of 13.96M classes
      iters: 30
      chunk: 2048
      fit_chunk: 131072
    river:
      buckets: 1000
      sample: 4000000        # of 123M classes (1-D k-means on equity)
      iters: 50
      chunk: 65536
      fit_chunk: 131072
